# =============================================================================
# ReferenceInputs.yaml - parameters for the assessed categories.
#
# Holds every value the model cannot derive from the operations physicals: the
# currency basis, the factor hierarchy, the parameters for categories assessed
# off external data, and the exclusion register.
#
# Factors are not here.  They live in Reference/Factors.csv, one table across
# all three scopes, with Reference/Items.csv holding what each factor prices.
# Nothing is duplicated between the two.
#
# Method basis: Scope 3 Category Assessment Methods, Ravenswood Gold Pty Ltd.
# Category numbering follows the GHG Protocol Corporate Value Chain
# (Scope 3) Accounting and Reporting Standard, so a category number here means
# what that standard says it means.
# =============================================================================

meta:
  method_document: Scope3CategoryAssessmentMethods.docx

  # The factor table is Reference/Factors.csv, maintained in the Builder and
  # served against Reference/Items.csv.
  factor_table: Factors.csv

  factor_registers:
    product_groups: ProductGroups.csv
    epa_naics: EpaNaicsFactorMapping.csv
    exceptions: ProductGroupsExceptions.csv
    capital_factors: Cat2FactorMap.csv
    capital_projects: Cat2ProjectScreen.csv
    capital_register: Cat2RegisterReview.csv
    supplier_spend: ApSpendClassification.csv
  reference_fx: ReferenceFx.csv

# -----------------------------------------------------------------------------
# Currency basis
#
# The EPA supply chain factors are published in kilograms of CO2-e per 2022
# United States dollar.  Site expenditure is recorded in Australian dollars at
# the date incurred, so a rate is required.  PrepData distributes
# ReferenceFx.csv, quarterly AUD/USD, and converts nothing itself.
#
#   mode: reference_fx   the quarter's rate from ReferenceFx.csv applies to
#                        each month in that quarter, then the deflator below.
#   mode: fixed          one rate for every month, from fixed_rate_audusd.
#
# deflate_to_factor_year restates spend to the dollars the factor is stated in.
# Spend is converted to United States dollars at the quarter's rate, then
# multiplied by Index(factor_dollar_year) / Index(spend year) from
# Reference/PriceIndex.csv.  Prices have risen since 2022, so the ratio is
# below one: 0.909 for 2025 spend and 0.876 for 2026.  Set to false, nominal
# spend meets a 2022 factor and the result is overstated by that inflation.
# -----------------------------------------------------------------------------
currency:
  mode: reference_fx
  fixed_rate_audusd: 0.6290
  deflate_to_factor_year: true
  price_index_series: US CPI-U
  factor_dollar_year: 2022

# -----------------------------------------------------------------------------
# Category 1 - purchased goods and services
#
# Spend based on product group, except where a physical unit factor exists.
# The hierarchy is physical unit first, then spend.
#
# excluded_groups are the fuels.  Their combustion is Scope 1 and their
# well to tank is Category 3, both computed from NGA factors at transaction
# level, so charging their spend again here would double count them.
# -----------------------------------------------------------------------------
category_1:
  applies: true
  method: Spend based, with physical unit factors taking precedence
  excluded_groups:
    FUEL: Diesel and petrol.  Scope 1 combustion and Category 3 well to tank.
    LUBR: Lubricants.  Scope 1 combustion and Category 3 well to tank.
    PROP: Propane.  Scope 1 combustion and Category 3 well to tank.
    LABO: Labour type.  Not a purchased good.
    ZDEL: Deleted items.
    ZZZZ: Generic, to be corrected.

  # Physical unit factors, applied to quantity in the unit stated and taking
  # precedence over the spend based factor for the same group.
  # match_common_name is how the line is found in the operations physicals.
  # Explosives are delivered and loaded by the contractor and arrive on the
  # operations report, not on an inventory transaction, so they carry no
  # product group and no value and cannot be found by group code.
  physical_unit_factors:
    EXPL:
      factor: 2.12
      unit: t CO2-e per t
      quantity_uom: t
      match_common_name: Explosives
      source: AusLCI V48, ammonium nitrate, market for ammonium nitrate
      note: >
        Manufacture of the explosive.  Detonation is separate, 0.17 t CO2 per
        tonne on AGO 2004 Table 11, and is carried as Scope 1 in Config.py.
    GMED:
      factor: 1.92
      unit: t CO2-e per t
      quantity_uom: t
      match_common_name: Grinding media
      source: worldsteel Sustainability Indicators 2025, global average crude
        steel, 2024
      note: >
        Grinding media is bought and reported by the tonne, so it is priced on
        mass rather than on expenditure.  The spend based factor understated
        it badly and the reason is not the country of origin.  The US EPA
        Iron Foundries factor is per dollar of foundry sector output, which
        carries labour, machining and overhead as well as metal; grinding
        media is close to pure metal by value.  On expenditure the media
        priced at 0.354 t CO2-e per tonne of steel against a published global
        average of 1.92, understating it more than five fold.

        1.92 t CO2 per tonne of crude steel is the worldsteel figure for 2024,
        collected from 93 companies representing 51% of world production.  It
        is an interim: a supplier specific product carbon footprint, with the
        recycled content stated, is the better figure and is the one to ask
        for.  Against a blast furnace route with forging on top, 1.92 is
        conservative.

# -----------------------------------------------------------------------------
# Category 2 - capital goods
#
# Recognised in full in the year of acquisition.  Owned and finance leased
# only; rental is an expensed service and sits in Category 1.
# -----------------------------------------------------------------------------
category_2:
  applies: true
  method: Band calibrated intensity on capitalised value
  # Tenure recognised.  A rental is an expensed service and belongs in
  # Category 1, so only these tenures produce a Category 2 event.
  include_tenure:
    - Owned
    - Finance Lease
  include_approval_status:
    - Fully Approved
  exclude_treatments:
    - Excluded, intangible asset
  # Asset register category to the asset class carried in Cat2FactorMap.csv.
  # A category absent here is reported rather than defaulted, so no asset is
  # priced on a factor nobody chose.
  asset_class_map:
    Excavator: Mobile mining plant, dozers, graders
    Dozer: Mobile mining plant, dozers, graders
    Grader: Mobile mining plant, dozers, graders
    Loader: Mobile mining plant, dozers, graders
    Mobile Crusher: Other industrial machinery
    Truck: Heavy road trucks
    Light Vehicle: Light vehicles and utilities
    Trailer: Trailers and floats
    Forklift: Forklifts, stackers, yard tractors
    Elevated Work Platform: Forklifts, stackers, yard tractors
    Crane: Other industrial machinery
    Generator: Motors and generators
    Pump/Compressor: Other industrial machinery
    Transformer: Power transformers
    Switchgear: Switchgear, circuit breakers, metering
    Tank: Tanks and heavy gauge vessels
    Building: Industrial building construction
  # Whether the margin inclusive intensity is used.  Margins on a capital
  # good are its inbound freight, which is Category 4 on the Category 1
  # method, so the production only column is the consistent choice.
  use_margin_inclusive_factor: false

# -----------------------------------------------------------------------------
# Category 3 - fuel and energy related activities
#
# Computed in CalcEmissions.py from NGA Scope 3 coefficients at transaction
# level and carried on the Scope3_tCO2e column of the operations frame.  No
# parameter is required and nothing is recomputed here.
# -----------------------------------------------------------------------------
category_3:
  applies: true
  method: NGA Scope 3 well to tank on fuel, plus transmission and distribution
    losses on purchased grid electricity
  source_column: Scope3_tCO2e

# -----------------------------------------------------------------------------
# Category 4 - upstream transport and distribution
#
# The EPA margin component of the same factor set, on the same expenditure.
# Fuel inbound freight is excluded; it is inside the Category 3 well to tank
# coefficient.
# -----------------------------------------------------------------------------
category_4:
  applies: true
  method: EPA supply chain margin factors on purchase expenditure
  excluded_groups:
    FUEL: Inbound freight is inside the Category 3 well to tank coefficient.
    LUBR: As above.
    PROP: As above.

# -----------------------------------------------------------------------------
# Category 5 - waste generated in operations
#
# General and prescribed waste only.  Tailings and waste rock are process
# residues retained on site under the environmental authority, not streams
# transferred for treatment, and are excluded below.
#
# A stream with a null tonnes_per_year is reported as outstanding rather than
# assumed nil, so the gap is visible.  scale_to_subactivity carries a measured
# year across the mine life on a physical driver instead of running it flat;
# leave it null to hold the estimate flat.
# -----------------------------------------------------------------------------
category_5:
  applies: true
  method: Waste mass by stream times a treatment factor
  data_supplied: false
  scale_to_subactivity: Ore Milled
  baseline_year: 2026
  # No waste stream is identified today, so the category reports as None
  # identified rather than outstanding.  A stream is added under streams with
  # its tonnes a year when it is identified, and the category is then
  # calculated.  Factors held ready for the likely streams:
  #   - name: General waste to landfill
  #     tonnes_per_year: 0
  #     factor_tco2e_per_t: 0.586
  #     factor_source: NGA Factors, solid waste to landfill, mixed municipal
  #   - name: Prescribed and hazardous waste
  #     tonnes_per_year: 0
  #     factor_tco2e_per_t: 0.020
  #     factor_source: Treatment and disposal, screening factor
  #   - name: Recycled metals
  #     tonnes_per_year: 0
  #     factor_tco2e_per_t: 0.021
  #     factor_source: Recycling, screening factor
  none_identified: No waste stream is identified for this inventory today.
    Streams are added as they are identified.
  streams: []
  excluded:
    Tailings: Process residue retained on site under environmental authority
      EPML00979013, not a waste stream transferred for treatment.
    Waste rock: Process residue placed in engineered dumps on site.

# -----------------------------------------------------------------------------
# Category 6 - business travel
#
# Off site legs only.  On site vehicle fuel is Scope 1 already.
#
# Air travel is the Brisbane to Townsville corridor at about one and a half
# return trips a week.  return_trip true counts both sectors.
# -----------------------------------------------------------------------------
category_6:
  applies: true
  method: Aviation and passenger vehicle factors on the stated travel pattern
  data_supplied: true
  scale_to_subactivity: Ore Milled
  baseline_year: 2026
  air_legs:
    - name: Brisbane to Townsville
      sectors_per_week: 1.5
      km_per_sector: 1110
      return_trip: true
      factor_kgco2e_per_pkm: 0.155
      factor_source: Recognised aviation factor, domestic short haul, economy
  road_legs: []

# -----------------------------------------------------------------------------
# Category 7 - employee commuting
#
# Drive in drive out, 500 personnel on an even time roster of four days on and
# three days off.  The roster runs two crews of 250, each crew travelling once
# a week, so every person makes 52 return trips a year and about 250 people
# travel at each of the two weekly changeovers.
#
# Distances are one way, Ravenswood to the worker's home town, and the split
# is by share of the workforce.  Occupancy is the number of people per
# vehicle; at 1.0 every person drives alone, which is the conservative case.
#
# Headcount is carried in the operations physicals in full time equivalents,
# so scale_to_headcount runs the workforce down with the roster over the mine
# life instead of holding 500 people flat to the horizon.
# -----------------------------------------------------------------------------
category_7:
  applies: true
  method: Passenger vehicle factor on roster headcount and stated distance
  data_supplied: true
  roster:
    workforce_headcount: 500
    crews: 2
    return_trips_per_person_per_year: 52
    scale_to_headcount: true
    baseline_headcount_year: 2026
    occupancy: 1.0
    factor_kgco2e_per_km: 0.181
    factor_source: NGA Factors, passenger vehicle, diesel and petrol blend
    legs:
      - name: Ravenswood to Townsville
        share: 0.50
        one_way_km: 129
        distance_source: Site to Townsville port, as used for inbound freight
      - name: Ravenswood to Charters Towers
        share: 0.30
        one_way_km: 89
        distance_source: Ravenswood to Mingela to Charters Towers
      - name: Ravenswood to Ayr
        share: 0.20
        one_way_km: 150
        distance_source: Ravenswood to Mingela to the Bruce Highway to Ayr.
          To be confirmed against the route actually driven.

# -----------------------------------------------------------------------------
# Category 10 - processing of sold products
#
# Refining of dore into investment grade gold.  Gold mass comes from the
# operations physicals; the intensity is external.
# -----------------------------------------------------------------------------
category_10:
  applies: true
  method: Gold mass times a published refining intensity
  data_supplied: false
  gold_subactivity: Gold Sold
  refining_intensity_kgco2e_per_kg_au: 7.02
  factor_source: "World Gold Council, Gold Mining and Scope 3 GHG Emissions Accounting and Reporting, section 6.3 \"A note on downstream Category 10 emissions\", page 19."
  # ---------------------------------------------------------------------
  # What the factor has to represent, so the number chosen is the right one.
  #
  # The product sold is dore, not bullion, so the category is processing of
  # a sold intermediate product and the minimum boundary is the refiner's
  # own Scope 1 and Scope 2 emissions from the refining step.
  #
  # Ravenswood dore assays approximately 95 per cent gold and 5 per cent
  # silver.  It carries no copper and no significant base metal.  That
  # matters to the factor: a dore with copper or platinum group metals
  # requires an electrolytic route, whereas a gold-silver dore of this grade
  # refines by Miller chlorination and Wohlwill or by aqua regia, which is a
  # short, low energy process.  A published intensity taken from a refiner
  # handling base metal bearing dore would materially overstate this
  # facility's figure.
  #
  # A defensible source is therefore one of:
  #   - the intensity published by the refiner that actually takes the metal,
  #     which is the strongest evidence and the one to ask for first;
  #   - a published gold refining lifecycle figure that states the dore grade
  #     and the refining route it describes;
  #   - a World Gold Council or peer disclosure that states both.
  #
  # A figure without a stated grade and route is not usable here.
  dore_gold_share: 0.95
  dore_silver_share: 0.05
  dore_base_metals: none
  refining_route: Miller chlorination then Wohlwill, or aqua regia
  factor_requirement: >
    The intensity must state the dore grade and the refining route it
    describes.  A base metal bearing dore refines electrolytically at a
    materially higher intensity and its factor does not represent this
    facility.

# -----------------------------------------------------------------------------
# Documented exclusions.  Reassessed annually; an entry here is a position
# taken on current facts, not an omission.
# -----------------------------------------------------------------------------
exclusions:
  8: Upstream leased assets.  Operating emissions of assets the Company runs
    are already in Scope 1 and Scope 2 under the operational control boundary.
    Tested annually against contractor dry hire arrangements.
  9: Downstream transport and distribution.  Dore is handed over at the mine
    site and onward freight is not the Company's risk.
  11: Use of sold products.  Gold is an inert store of value with no use phase.
  12: End of life treatment of sold products.  Gold is not consumed or
    disposed of.
  13: Downstream leased assets.  None.
  14: Franchises.  None.
  15: Investments.  Privately held with no material financed emissions.

# -----------------------------------------------------------------------------
# Forward projection
#
# Expenditure is recorded on inventory transactions only, and only from
# January 2026.  The budget physicals carry quantity and no value at all, so
# the spend based categories cannot be projected on recorded spend.
#
#   basis: unit_rate       a dollar per reporting unit rate is fitted per
#                          product group over the window below and applied to
#                          budget quantities.  Projects each group on its own
#                          consumption.
#   basis: none            actual periods only; the projection is left blank
#                          and the tab says so.
#
# The rate is nominal and is not escalated.  A group with no fitted rate,
# because it has no valued month, projects nothing and is listed.
# -----------------------------------------------------------------------------
projection:
  basis: unit_rate
  rate_window_from: 2026-01-01
  rate_window_to: 2026-07-31
  escalation_per_year: 0.0

  # Stores lines have no budget counterpart at all: the budget physicals carry
  # no Stores activity, so there is no quantity to price.  They are a quarter
  # of recorded Category 1 spend, so leaving them out understates the forward
  # years by that much.
  #
  #   none              stores are reported in the actual periods only and
  #                     named as an unprojected gap.
  #   milled_intensity  a dollar per tonne milled rate is fitted over the same
  #                     window and applied to projected milled tonnes.
  unmatched_basis: none
  unmatched_driver_subactivity: Ore Milled

  # Row types that can carry expenditure.  Production, revenue, headcount and
  # electricity measures are drivers of consumption, not purchases, so they are
  # never priced and never reported as an unprojected gap.
  projectable_rowtypes:
    - consumption
    - stores
    - fuel
    - services

# -----------------------------------------------------------------------------
# Contract services
#
# Contractor charges arrive from the general ledger in dollars, with no product
# group, so nothing would price them.  Each subactivity is given the product
# group that prices the same service when it is bought through stores, so one
# service carries one factor whichever system it was bought through.  A row
# that already carries a product group keeps it.
#
# Wet hire is contractor plant with operators, with fuel issued by site.  It is
# priced as a blend of two published factors: the equipment share at machinery
# rental and the operator share at labour hire.  It is not priced as a
# construction contractor, whose factor includes the fuel the contractor buys;
# here that fuel is site diesel and is already Scope 1, so it would be counted
# twice.
#
# The blend is calculated from the two factors in Reference/Factors.csv every
# build, so a later edition of either moves it.  equipment_share is edited on
# the Assumptions page and published with every build.
# -----------------------------------------------------------------------------
contract_services:
  activity: Contract labour
  groups:
    - name: Labour
      product_group: CONL
      note: Labour hire and trades without tools, priced at EPA SCEF 561320.
    - name: Professional
      product_group: CONQ
      note: Consultants, priced at EPA SCEF 541620.
    - name: Wet hire
      product_group: WETH
      note: Plant with operators and no fuel, priced on the blend below.
  blends:
    - name: Wet hire
      product_group: WETH
      description: CONTRACTORS - WET HIRE
      equipment_share: 0.5
      equipment_factor: "Spend-based|EPA SCEF|Construction, Mining, and Forestry Machinery and Equipment Rental and Leasing|USA|kg/USD"
      operator_factor: "Spend-based|EPA SCEF|Temporary Help Services|USA|kg/USD"
      factor_source: EPA Supply Chain GHG Emission Factors v1.3, 532412 and 561320.  Split estimated at half and half until the contract rate schedule gives one.

# -----------------------------------------------------------------------------
# Activity streams
#
# The continuity check on Verify expects every stream to run every year from
# its first to its last, because a stream that stops part way through takes
# its emissions with it and the total reads as an abatement.  Some streams do
# not run every year by nature.  One set as intermittent is not faulted for a
# gap; one with a last_year is faulted for every year it runs past it.
# -----------------------------------------------------------------------------
streams:
  expected:
    - name: Dredging
      intermittent: true
      last_year: 2030
      factor_source: Operations advice, September 2026.  The dredge does not run every year and is expected to stop by about 2030.
    - name: Tailings
      intermittent: false
      factor_source: Operations advice, September 2026.  Tailings deposition is continuous while the plant runs.

# -----------------------------------------------------------------------------
# Units
#
# A pack sold by mass and reported by volume.  Used only where a line arrives
# in a count and the item description gives its size in mass, and only for the
# subactivities named.  The figure is litres per kilogram.  PrepData's own
# conversions register takes grease at one litre per kilogram (a 450 g
# cartridge is recorded as 0.45 L), and this follows it so the two programs
# agree.
# -----------------------------------------------------------------------------
units:
  mass_as_volume:
    - name: Greases
      litres_per_kg: 1.0
      factor_source: PrepData conversions register convention, a 450 g cartridge recorded as 0.45 L

  # A figure recorded in one unit under the heading of another.  The builder
  # reads it in the unit it is really in, and never writes to the file it came
  # from.  A correction applies only while the rows it names sit guard_ratio
  # times or more away from the same stream's typical month outside them, so
  # once the source is put right the correction stops applying by itself and
  # Verify says so.  Every correction and whether it applied is published with
  # the build.
  corrections:
    - name: Explosives loaded, Dec-25 operations report
      activity: Blasting
      subactivity: Explosives
      dataset: Actual
      from: 2025-01-01
      to: 2025-12-31
      stated_unit: t
      actual_unit: kg
      guard_ratio: 100
      factor_source: The Dec-25 operations report labels explosives loaded (accounts 10202129570 and 10203129570) in t, and the figures are kilograms.  The FY 2026 report labels the same accounts kg with figures of the same size.
    - name: Explosives loaded, forecast
      activity: Blasting
      subactivity: Explosives
      dataset: Budget
      stated_unit: t
      actual_unit: kg
      guard_ratio: 100
      factor_source: The forecast carries the Dec-25 kilogram scale under a tonne heading, about 120,000 a month for Buck Reef West against about 250 t recorded.
